<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560">
  <rect width="560" height="560" fill="#efefed"/>
  <!-- vase -->
  <path d="M225 330 c-18 40 -30 70 -30 96 c0 42 26 70 85 70 s85 -28 85 -70 c0 -26 -12 -56 -30 -96 z"
        fill="#ffffff" stroke="#2e2e2e" stroke-width="4"/>
  <path d="M225 330 c-8 -16 -4 -30 12 -34 l98 0 c16 4 20 18 12 34" fill="#ffffff" stroke="#2e2e2e" stroke-width="4"/>
  <!-- vase stripes -->
  <path d="M204 412 c40 14 112 14 152 0" stroke="#2e2e2e" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M200 446 c48 16 116 16 160 0" stroke="#2e2e2e" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- stems -->
  <g stroke="#2e2e2e" stroke-width="3.4" fill="none" stroke-linecap="round">
    <path d="M280 330 c0 -50 -4 -80 -22 -110"/>
    <path d="M280 330 c0 -60 8 -90 30 -120"/>
    <path d="M280 330 c0 -40 0 -70 0 -96"/>
  </g>
  <!-- leaves -->
  <path d="M258 265 c-26 -10 -38 -30 -34 -54 c24 2 40 20 42 46 z" fill="#ffffff" stroke="#2e2e2e" stroke-width="3.2" stroke-linejoin="round"/>
  <path d="M316 275 c26 -12 36 -34 30 -56 c-24 4 -38 22 -40 48 z" fill="#ffffff" stroke="#2e2e2e" stroke-width="3.2" stroke-linejoin="round"/>
  <!-- center flower -->
  <g transform="translate(280 178)">
    <circle r="17" fill="#2e2e2e"/>
    <g stroke="#2e2e2e" stroke-width="3.2" fill="#ffffff">
      <ellipse rx="13" ry="26" cy="-30" stroke-linejoin="round"/>
      <ellipse rx="13" ry="26" cy="-30" transform="rotate(72)" stroke-linejoin="round"/>
      <ellipse rx="13" ry="26" cy="-30" transform="rotate(144)" stroke-linejoin="round"/>
      <ellipse rx="13" ry="26" cy="-30" transform="rotate(216)" stroke-linejoin="round"/>
      <ellipse rx="13" ry="26" cy="-30" transform="rotate(288)" stroke-linejoin="round"/>
    </g>
    <circle r="15" fill="#efefed" stroke="#2e2e2e" stroke-width="3"/>
  </g>
  <!-- left flower, slightly smaller, tilted -->
  <g transform="translate(246 196) rotate(-16) scale(0.78)">
    <circle r="15" fill="#2e2e2e"/>
    <g stroke="#2e2e2e" stroke-width="3.2" fill="#ffffff">
      <ellipse rx="13" ry="26" cy="-30" stroke-linejoin="round"/>
      <ellipse rx="13" ry="26" cy="-30" transform="rotate(72)" stroke-linejoin="round"/>
      <ellipse rx="13" ry="26" cy="-30" transform="rotate(144)" stroke-linejoin="round"/>
      <ellipse rx="13" ry="26" cy="-30" transform="rotate(216)" stroke-linejoin="round"/>
      <ellipse rx="13" ry="26" cy="-30" transform="rotate(288)" stroke-linejoin="round"/>
    </g>
    <circle r="14" fill="#efefed" stroke="#2e2e2e" stroke-width="3"/>
  </g>
  <!-- right flower -->
  <g transform="translate(318 190) rotate(14) scale(0.85)">
    <circle r="15" fill="#2e2e2e"/>
    <g stroke="#2e2e2e" stroke-width="3.2" fill="#ffffff">
      <ellipse rx="13" ry="26" cy="-30" stroke-linejoin="round"/>
      <ellipse rx="13" ry="26" cy="-30" transform="rotate(72)" stroke-linejoin="round"/>
      <ellipse rx="13" ry="26" cy="-30" transform="rotate(144)" stroke-linejoin="round"/>
      <ellipse rx="13" ry="26" cy="-30" transform="rotate(216)" stroke-linejoin="round"/>
      <ellipse rx="13" ry="26" cy="-30" transform="rotate(288)" stroke-linejoin="round"/>
    </g>
    <circle r="14" fill="#efefed" stroke="#2e2e2e" stroke-width="3"/>
  </g>
  <!-- floating petals -->
  <g fill="#ffffff" stroke="#2e2e2e" stroke-width="2.4">
    <path d="M402 210 c10 -12 26 -12 34 0 c-8 12 -24 12 -34 0 z"/>
    <path d="M158 160 c8 -10 22 -10 28 0 c-6 10 -20 10 -28 0 z"/>
    <path d="M424 300 c7 -8 18 -8 24 0 c-6 8 -16 8 -24 0 z"/>
  </g>
  <!-- ground shadow line -->
  <path d="M190 505 c60 12 120 12 180 0" stroke="#9a9a9a" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>

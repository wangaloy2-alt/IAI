<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560">
  <rect width="560" height="560" fill="#efefed"/>
  <!-- back paper -->
  <g transform="rotate(-9 280 300)">
    <rect x="150" y="120" width="280" height="360" rx="6" fill="#ffffff" stroke="#2e2e2e" stroke-width="3"/>
    <g stroke="#9a9a9a" stroke-width="2" stroke-linecap="round">
      <line x1="180" y1="170" x2="400" y2="170"/>
      <line x1="180" y1="210" x2="400" y2="210"/>
      <line x1="180" y1="250" x2="380" y2="250"/>
      <line x1="180" y1="290" x2="400" y2="290"/>
      <line x1="180" y1="330" x2="360" y2="330"/>
    </g>
  </g>
  <!-- middle paper -->
  <g transform="rotate(-2 290 310)">
    <rect x="160" y="135" width="280" height="360" rx="6" fill="#ffffff" stroke="#2e2e2e" stroke-width="3.5"/>
    <rect x="185" y="160" width="110" height="26" fill="none" stroke="#2e2e2e" stroke-width="3"/>
    <line x1="315" y1="173" x2="415" y2="173" stroke="#2e2e2e" stroke-width="3" stroke-linecap="round"/>
    <!-- choice rows -->
    <g stroke="#2e2e2e" stroke-width="2.6" stroke-linecap="round" fill="none">
      <g>
        <rect x="185" y="215" width="16" height="16"/>
        <line x1="212" y1="223" x2="300" y2="223"/>
        <rect x="330" y="215" width="16" height="16"/>
        <line x1="357" y1="223" x2="415" y2="223"/>
      </g>
      <g>
        <rect x="185" y="258" width="16" height="16"/>
        <line x1="212" y1="266" x2="285" y2="266"/>
        <rect x="330" y="258" width="16" height="16"/>
        <line x1="357" y1="266" x2="400" y2="266"/>
      </g>
      <!-- an X marking the answer -->
      <g stroke-width="3.4">
        <line x1="186" y1="216" x2="200" y2="230"/>
        <line x1="200" y1="216" x2="186" y2="230"/>
      </g>
    </g>
    <line x1="185" y1="320" x2="415" y2="320" stroke="#9a9a9a" stroke-width="2" stroke-linecap="round"/>
    <line x1="185" y1="360" x2="415" y2="360" stroke="#9a9a9a" stroke-width="2" stroke-linecap="round"/>
    <line x1="185" y1="400" x2="370" y2="400" stroke="#9a9a9a" stroke-width="2" stroke-linecap="round"/>
    <line x1="185" y1="440" x2="395" y2="440" stroke="#9a9a9a" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- top paper: essay sheet -->
  <g transform="rotate(6 300 300)">
    <rect x="175" y="140" width="280" height="360" rx="6" fill="#ffffff" stroke="#2e2e2e" stroke-width="4"/>
    <rect x="200" y="165" width="230" height="30" fill="none" stroke="#2e2e2e" stroke-width="3"/>
    <text x="315" y="187" text-anchor="middle" font-family="Georgia, serif" font-size="17" letter-spacing="3" fill="#2e2e2e">ENGLISH</text>
    <g stroke="#2e2e2e" stroke-width="2.6" stroke-linecap="round" fill="none">
      <line x1="200" y1="230" x2="430" y2="230"/>
      <line x1="200" y1="266" x2="415" y2="266"/>
      <line x1="200" y1="302" x2="430" y2="302"/>
      <line x1="200" y1="338" x2="300" y2="338"/>
    </g>
    <!-- score box -->
    <rect x="365" y="415" width="65" height="52" fill="none" stroke="#2e2e2e" stroke-width="3"/>
    <text x="397" y="448" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#2e2e2e">145</text>
    <line x1="200" y1="441" x2="350" y2="441" stroke="#9a9a9a" stroke-width="2" stroke-linecap="round"/>
    <!-- corner fold -->
    <path d="M455 140 l0 26 l-26 0 z" fill="#efefed" stroke="#2e2e2e" stroke-width="3" stroke-linejoin="round"/>
  </g>
  <!-- pencil -->
  <g transform="rotate(38 130 430)">
    <rect x="95" y="418" width="270" height="24" fill="#ffffff" stroke="#2e2e2e" stroke-width="3.2" rx="3"/>
    <path d="M95 418 l-34 12 l34 12 z" fill="#2e2e2e"/>
    <path d="M75 430 l-14 5 l14 5 z" fill="#efefed" stroke="#2e2e2e" stroke-width="2.4"/>
    <line x1="270" y1="418" x2="270" y2="442" stroke="#2e2e2e" stroke-width="2.6"/>
    <line x1="288" y1="418" x2="288" y2="442" stroke="#2e2e2e" stroke-width="2.6"/>
    <path d="M365 418 l22 12 l-22 12 z" fill="#efefed" stroke="#2e2e2e" stroke-width="3" stroke-linejoin="round"/>
  </g>
</svg>
